name: RCA on Build Failure

on:
  workflow_run:
    workflows: ["Java CI with Maven"]
    types:
      - completed

jobs:
  rca:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download workflow run logs (via API)
        id: download_logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "Downloading logs for run id: $RUN_ID"
          curl -sS -L -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs" -o logs.zip
          ls -l logs.zip

      - name: Unzip logs
        run: |
          mkdir -p rca/logs
          unzip -q logs.zip -d rca/logs || true

      - name: Merge relevant logs into one file
        run: |
          mkdir -p rca/merged
          # Concatenate text files into a single build.log
          find rca/logs -type f -name "*.txt" -print0 | xargs -0 cat > rca/merged/build.log || true
          if [ ! -s rca/merged/build.log ]; then
            # Fallback: concatenate all files
            find rca/logs -type f -print0 | xargs -0 cat > rca/merged/build.log || true
          fi
          wc -c rca/merged/build.log || true

      - name: Compile RCA analyzer
        working-directory: ./.github/rca
        run: |
          javac RcaAnalyzer.java

      - name: Run RCA analyzer
        working-directory: ./.github/rca
        env:
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: |
          # paths: from .github/rca, merged log is at repo_root/rca/merged/build.log -> ../../rca/merged/build.log
          java RcaAnalyzer ../../rca/merged/build.log ../../rca/analysis.txt "OPENROUTER_TOKEN"

      - name: Upload RCA artifact
        uses: actions/upload-artifact@v4
        with:
          name: rca-analysis
          path: rca/analysis.txt

      - name: Post analysis as check run annotation
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const analysisPath = 'rca/analysis.txt';
            if (fs.existsSync(analysisPath)) {
              const body = fs.readFileSync(analysisPath, 'utf8').slice(0, 64000);
              await github.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'RCA Analysis',
                head_sha: context.payload.workflow_run.head_sha,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Automated Root Cause Analysis',
                  summary: 'RCA generated by OpenRouter',
                  text: body
                }
              });
            } else {
              throw new Error('Analysis file not found at ' + analysisPath);
            }
