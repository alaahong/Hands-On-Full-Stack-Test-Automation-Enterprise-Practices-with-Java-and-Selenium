name: RCA on Build Failure

on:
  workflow_run:
    workflows: ["Java CI with Maven"]
    types:
      - completed

jobs:
  rca:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download workflow run logs (via API)
        id: download_logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "Downloading logs for run id: $RUN_ID"
          # 生成时间戳，确保每次文件名不同，便于保存历史
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          LOGFILE="logs-${RUN_ID}-${TIMESTAMP}.zip"
          echo "LOGFILE=$LOGFILE" >> $GITHUB_ENV
          curl -sS -L -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs" -o "$LOGFILE"
          ls -l "$LOGFILE"

      - name: Unzip logs
        run: |
          mkdir -p rca/logs
          # 使用之前步骤写入的环境变量 LOGFILE
          unzip -q "$LOGFILE" -d rca/logs || true

      - name: Merge relevant logs into one file
        run: |
          mkdir -p rca/merged
          # Concatenate text files into a single build.log
          find rca/logs -type f -name "*.txt" -print0 | xargs -0 cat > rca/merged/build.log || true
          if [ ! -s rca/merged/build.log ]; then
            # Fallback: concatenate all files
            find rca/logs -type f -print0 | xargs -0 cat > rca/merged/build.log || true
          fi
          wc -c rca/merged/build.log || true

      - name: Compile RCA analyzer
        working-directory: ./.github/rca
        run: |
          javac RcaAnalyzer.java

      - name: Run RCA analyzer
        working-directory: ./.github/rca
        env:
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: |
          # paths: from .github/rca, merged log is at repo_root/rca/merged/build.log -> ../../rca/merged/build.log
          java RcaAnalyzer ../../rca/merged/build.log ../../rca/analysis.txt ${{ secrets.OPENROUTER_TOKEN }} ${{ secrets.OPENROUTER_MODEL }}

      - name: Prepare artifact name and timestamped file
        run: |
          set -euo pipefail
          # 使用 UTC 时间戳，格式兼容文件名
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          ARTIFACT_NAME="rca-analysis-${{ github.event.workflow_run.id }}-${TIMESTAMP}"
          ARTIFACT_FILE="${ARTIFACT_NAME}.txt"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "ARTIFACT_FILE=$ARTIFACT_FILE" >> $GITHUB_ENV
          mkdir -p rca
          if [ -f rca/analysis.txt ]; then
            cp rca/analysis.txt rca/${ARTIFACT_FILE}
            echo "Prepared rca/${ARTIFACT_FILE}"
          else
            # 如果分析文件不存在，创建一个占位文件以避免上传失败
            echo "No analysis produced" > rca/${ARTIFACT_FILE}
            echo "Placeholder created rca/${ARTIFACT_FILE}"
          fi
          ls -l rca | sed -n '1,200p'

      - name: Upload RCA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: rca/${{ env.ARTIFACT_FILE }}

      - name: Post analysis as check run annotation
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const analysisPath = `rca/${process.env.ARTIFACT_FILE || 'analysis.txt'}`;
            if (!fs.existsSync(analysisPath)) {
              throw new Error('Analysis file not found at ' + analysisPath);
            }
            const full = fs.readFileSync(analysisPath, 'utf8');
            const MAX = 64000; // GitHub checks output limit in bytes (safe margin)

            // 返回一个在字节上不超过 maxBytes 的安全截断字符串，优先在段落/句末处截断
            function safeTruncateByBytes(text, maxBytes) {
              if (Buffer.byteLength(text, 'utf8') <= maxBytes) return {result: text, truncated: false, usedBytes: Buffer.byteLength(text,'utf8')};
              const preferLimit = maxBytes - 200; // 预留空间用于附加说明

              // 尝试按段落或句末截断
              let idx = -1;
              const paraCut = text.lastIndexOf('\n\n', Math.max(0, preferLimit));
              if (paraCut > 0) idx = paraCut;
              else {
                const range = Math.max(0, preferLimit - 40);
                const lastDot = text.lastIndexOf('.', range);
                const lastQ = text.lastIndexOf('?', range);
                const lastEx = text.lastIndexOf('!', range);
                const lastPunct = Math.max(lastDot, lastQ, lastEx);
                if (lastPunct > 0) idx = lastPunct + 1;
                else {
                  const lastNewline = text.lastIndexOf('\n', Math.max(0, preferLimit));
                  if (lastNewline > 0) idx = lastNewline;
                }
              }
              if (idx <= 0) idx = preferLimit;

              // 回退修正：确保按字符截取后的字节长度确实 <= maxBytes
              let candidate = text.slice(0, idx);
              let candBytes = Buffer.byteLength(candidate, 'utf8');
              while (candBytes > maxBytes) {
                // 快速缩小：向前移动到原长度的90%
                idx = Math.floor(idx * 0.9);
                if (idx <= 0) { candidate = ''; break; }
                candidate = text.slice(0, idx);
                candBytes = Buffer.byteLength(candidate, 'utf8');
              }
              return {result: candidate, truncated: true, usedBytes: candBytes};
            }

            const trunc = safeTruncateByBytes(full, MAX);
            const body = trunc.result;
            const truncated = trunc.truncated;
            const usedBytes = trunc.usedBytes;

            const artifactFile = process.env.ARTIFACT_FILE || 'analysis.txt';
            const note = `\n\n---\n（已截断显示：原始 ${Buffer.byteLength(full,'utf8')} 字节；已展示 ${usedBytes} 字节；完整分析请下载 artifact 文件：${artifactFile}）`;
            const outputText = body + note;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'RCA Analysis',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Automated Root Cause Analysis',
                summary: truncated ? 'RCA 报告（已截断，完整内容见 artifact）' : 'RCA 报告',
                text: outputText
              }
            });
