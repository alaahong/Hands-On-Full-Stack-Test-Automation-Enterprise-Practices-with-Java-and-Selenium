name: Module 09 tests on Chrome 85 (Selenoid)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: { }

jobs:
  test-chrome85:
    runs-on: ubuntu-latest
    env:
      HEADLESS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25-ea'
          cache: maven

      - name: Start Selenoid (Chrome 85)
        run: |
          docker pull aerokube/selenoid:latest-release
          docker pull selenoid/chrome:85.0
          mkdir -p selenoid
          cat > selenoid/browsers.json <<'JSON'
          {
            "chrome": {
              "default": "85.0",
              "versions": {
                "85.0": {
                  "image": "selenoid/chrome:85.0",
                  "port": "4444",
                  "path": "/",
                  "tmpfs": {"/tmp":"size=512m"},
                  "env": ["TZ=Asia/Shanghai"]
                }
              }
            }
          }
          JSON
          docker run -d --name selenoid \
            -p 4444:4444 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE/selenoid/browsers.json:/etc/selenoid/browsers.json:ro" \
            aerokube/selenoid:latest-release \
            -limit 4 -conf /etc/selenoid/browsers.json
          for i in {1..30}; do
            if curl -sf http://localhost:4444/status | grep -q '"ready":\s*true'; then
              echo "Selenoid is ready"; break
            fi
            sleep 1
          done

      - name: Build and run tests (module 09 via RemoteWebDriver)
        run: |
          mvn -B -V -pl 09-selenium-4-29-0 -am \
            -DskipTests=false \
            -Dselenium.remote.url=http://localhost:4444/wd/hub \
            -DbrowserVersion=85.0 \
            test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-09
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/surefire-report.html
