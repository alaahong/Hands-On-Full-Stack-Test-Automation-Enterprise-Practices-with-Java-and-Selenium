name: Module 09 tests on Chrome 85 (Selenium Docker)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: { }

jobs:
  test-chrome85:
    runs-on: ubuntu-latest
    env:
      HEADLESS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25-ea'
          cache: maven

      - name: Start selenium/standalone-chrome:85.0-20200921
        run: |
          docker pull selenium/standalone-chrome:85.0-20200921
          docker run -d --name selenium-chrome-85 -p 4444:4444 selenium/standalone-chrome:85.0-20200921
          for i in {1..30}; do
            if curl -sf http://localhost:4444/wd/hub/status | grep -q '"ready":\s*true'; then
              echo "Selenium is ready"; break
            fi
            sleep 1
          done

      - name: Build and run tests (module 09 via RemoteWebDriver)
        run: |
          mvn -B -V -pl 09-selenium-4-29-0 -am \
            -DskipTests=false \
            -Dselenium.remote.url=http://localhost:4444/wd/hub \
            -DbrowserVersion=85.0 \
            test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-09
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/surefire-report.html
