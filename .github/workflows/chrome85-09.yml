name: Module 09 tests on Chrome 85 (Local Chrome)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: { }

jobs:
  test-chrome85:
    runs-on: ubuntu-latest
    env:
      HEADLESS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Chrome 85
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '85.0.4183.121'

      - name: Show Chrome info
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          echo "Chrome version: ${{ steps.setup-chrome.outputs.chrome-version }}"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version || true

      - name: Build and run tests (module 09) with local Chrome
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          BROWSER_VERSION: ${{ steps.setup-chrome.outputs.chrome-version }}
        run: mvn -B -V -pl 09-selenium-4-29-0 -am -DskipTests=false test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-09
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/surefire-report.html
