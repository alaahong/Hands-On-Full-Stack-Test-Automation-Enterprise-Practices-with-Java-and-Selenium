name: Release Selenium MCP

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
      release_name:
        description: 'Release title (optional)'
        required: false
        default: ''
      release_body:
        description: 'Release notes / changelog (optional)'
        required: false
        default: ''
      draft:
        description: 'Create the release as draft? (true/false)'
        required: false
        default: 'false'
      prerelease:
        description: 'Mark the release as prerelease? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build module and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build 08-selenium-mcp module
        run: mvn -B -pl 08-selenium-mcp -am -DskipTests package

      - name: Find generated JAR
        id: findjar
        run: |
          set -e
          echo "Looking for JAR in 08-selenium-mcp/target"
          jar=$(ls 08-selenium-mcp/target/*.jar | head -n 1 || true)
          if [ -z "$jar" ]; then
            echo "No jar found in 08-selenium-mcp/target" >&2
            exit 1
          fi
          echo "jar=$jar" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_version }}
          release_name: ${{ github.event.inputs.release_name || github.event.inputs.release_version }}
          body: ${{ github.event.inputs.release_body }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.findjar.outputs.jar }}
          asset_name: selenium-mcp-${{ github.event.inputs.release_version }}.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: echo "Release ${{ github.event.inputs.release_version }} published with JAR asset."
