suiteName: "Calculator basic scenarios (YAML)"
cases:
  - description: "正常加法：1 + 2 = 3"
    leftOperand: "1"
    rightOperand: "2"
    operator: "+"
    expectedResult: "3"
    caseType: "NORMAL"
  - description: "正常减法：5 - 3 = 2"
    leftOperand: "5"
    rightOperand: "3"
    operator: "-"
    expectedResult: "2"
    caseType: "NORMAL"
  - description: "输入错误：右操作数为字母"
    leftOperand: "5"
    rightOperand: "abc"
    operator: "*"
    expectedError: "请输入"
    caseType: "INPUT_ERROR"
  - description: "业务错误：除以 0"
    leftOperand: "10"
    rightOperand: "0"
    operator: "/"
    expectedError: "0"
    caseType: "DIVISION_BY_ZERO"

